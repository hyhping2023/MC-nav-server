[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcl2-env"
version = "0.1.0"
description = "VLA data collection and agent framework for Luanti + Mineclonia (MineClone2 lineage)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "gymnasium>=0.29",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "websockets>=12",
]

[project.optional-dependencies]
export = [
    "webdataset>=0.2",
    "datasets>=2.17",
    "tensorflow>=2.15",  # RLDS/TFRecord 导出用
]
server = ["uvicorn[standard]>=0.29"]

[tool.setuptools.packages.find]
include = ["mcl2_env*"]

[tool.setuptools.package-data]
mcl2_env = ["py.typed"]
