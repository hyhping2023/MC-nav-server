// vla.proto — Python（vla_env）↔ Purpur 插件 共享的 gRPC 契约。
// 对应 DESIGN.md §9.1；服务端写操作一律经 Bukkit 主线程调度（§4.2）。
syntax = "proto3";

package vla;

// 空消息（无返回的 RPC 统一使用 Void）。
message Void {}

// ---- 重置 ----

message ResetRequest {
  string player = 1;
  string task = 2;
  int32 seed = 3;
  // 重置区域（中心 + 半宽），空则用任务默认区域。
  int32 region_x = 4;
  int32 region_y = 5;
  int32 region_z = 6;
  int32 region_half_extent = 7;
  // 初始物品覆盖（M11）：如 ["minecraft:diamond_pickaxe", "minecraft:dirt@64"]。
  // 非空时覆盖任务默认 initialItems（hotbar 0-8 按序放置）。
  repeated string items = 8;
  // M11.5 自定义出生点（可选）：has_spawn=true 时传送到 (spawn_x, spawn_y, spawn_z)，
  // 面向 spawn_yaw；否则用 world.getSpawnLocation()。基线快照区域也随 spawn 移动
  //（region_* 未显式给出时以 spawn 为中心）。
  bool has_spawn = 9;
  double spawn_x = 10;
  double spawn_y = 11;
  double spawn_z = 12;
  float spawn_yaw = 13;
}

message ResetReply {
  int32 server_tick = 1;
  bool ok = 2;
  string message = 3;
}

// ---- Step 结算（server-authoritative）----

message StepRequest {
  string player = 1;
  // 阻塞等待的服务端 tick 数（默认 4）。
  int32 await_ticks = 2;
}

message StepReply {
  float reward = 1;
  bool terminated = 2;
  bool truncated = 3;
  int32 server_tick = 4;
  float progress = 5;
  map<string, string> info = 6;
}

// ---- 状态 ----

message StateRequest {
  string player = 1;
}

message StateReply {
  // 玩家/背包/统计/罗盘等本地状态，JSON 编码（字段见 DESIGN.md §8）。
  string json = 1;
}

// ---- 体素（32³，可选）----

message VoxelRequest {
  string player = 1;
  int32 center_x = 2;
  int32 center_y = 3;
  int32 center_z = 4;
  int32 half_extent = 5; // 默认 16 → 32³
}

message VoxelReply {
  repeated string palette = 1; // 块 id 表
  repeated int32 data = 2;     // 按 (x,y,z) 序的局部 palette 索引
  int32 origin_x = 3;
  int32 origin_y = 4;
  int32 origin_z = 5;
  int32 size = 6;              // 边长
}

// ---- 路径（A* 航点）----

message PathRequest {
  string player = 1;
  Vec3 start = 2;
  Vec3 goal = 3;
  string cost_mode = 4; // 可选："default" | "no_jump" | "water"
}

// 动作级航点注解（NavV2）：action ∈ walk|jump|fall|dig|dig_down|place；
// target 为需破坏/放置的方块坐标（仅 dig/dig_down/place 必填）。
message Waypoint {
  Vec3 pos = 1;      // 玩家脚格坐标（dig/dig_down 为源格，其余为目的格）
  string action = 2;
  Vec3 target = 3;
}

message PathReply {
  repeated Vec3 waypoints = 1; // 拐点序列（纯位置，向后兼容）
  bool found = 2;
  repeated Waypoint details = 3; // 动作级注解（NavV2）
}

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// ---- 任务 ----

message TaskRequest {
  string player = 1;
  string task = 2;       // 任务 id（registry）
  int32 seed = 3;        // 任务/重置种子
}

message TaskReply {
  string id = 1;
  string instruction = 2;
  string instruction_zh = 3;
  int32 difficulty = 4;
  float progress = 5;
  bool success = 6;
  int32 timeout_ticks = 7;
}

message GenerateRequest {
  string player = 1;
  string prompt = 2;     // 课程/LLM 生成提示
  int32 difficulty = 3;
  int32 seed = 4;        // 确定性种子（同 seed → 同任务；缺省 0 → 随机）
}

// ---- God Mode 世界控制 ----

message ClearRequest {
  string player = 1;
  int32 center_x = 2;
  int32 center_y = 3;
  int32 center_z = 4;
  int32 half_extent = 5; // 清实体/方块区域
  bool clear_blocks = 6;
  bool clear_entities = 7;
}

message TeleportRequest {
  string player = 1;
  Vec3 pos = 2;
  float yaw = 3;
  float pitch = 4;
}

message SpawnRequest {
  string player = 1;
  string entity_type = 2; // 如 "minecraft:zombie"
  Vec3 pos = 3;
  int32 count = 4;
}

message SetBlockRequest {
  string player = 1;
  Vec3 pos = 2;
  string block = 3; // 如 "minecraft:oak_log"
  bool apply_physics = 4;
}

// ---- 路径可视化（demo 寻路展示）----

message ShowPathRequest {
  string player = 1;
  // A* 航点（方块坐标，服务端在方块中心刷粒子）；clear=true 时忽略。
  repeated Vec3 waypoints = 2;
  // 目标点（树/目标块），单独高亮（加亮粒子簇）；clear=true 时忽略。
  Vec3 goal = 3;
  // true → 清除该玩家当前路径特效（重算/结束时调用）。
  bool clear = 4;
  // 特效保持 tick（0 = 默认 1200，即 60s；新路径会覆盖旧路径）。
  int32 lifetime_ticks = 5;
  // 路径类型："server"=服务端长程航点（黄色）| "client"=客户端局部路径（白色）；
  // 空/未设置默认 "server"。仅 waypoints 不为空时生效。
  string path_type = 6;
}

// ---- 通信底座（M1）----

message PingRequest {
  string client = 1; // 调用方标识（如 "vla_env_py"），调试用
}

message PingReply {
  int32 server_tick = 1; // Bukkit.getCurrentTick() 权威时钟
  double tps = 2;        // Paper API getTPS()
  string version = 3;    // "purpur-1.20.1-<build>"
  string world_name = 4;
}

// ---- 服务 ----

service VlaServer {
  // 连通性检查 + 权威 server_tick（M1 通信底座）。
  rpc Ping(PingRequest) returns (PingReply);
  // 重置世界与任务（主线程执行，§4.2）。
  rpc ResetWorld(ResetRequest) returns (ResetReply);
  // 阻塞等待 k ticks 后结算 reward/done/progress（server-authoritative）。
  rpc GetStepResult(StepRequest) returns (StepReply);
  // 玩家/背包/统计等本地状态。
  rpc GetState(StateRequest) returns (StateReply);
  // 32³ 体素矩阵（只读，可 gRPC 线程直读）。
  rpc GetVoxels(VoxelRequest) returns (VoxelReply);
  // 3D A* 航点（只读）。
  rpc ComputePath(PathRequest) returns (PathReply);
  // 设置任务。
  rpc SetTask(TaskRequest) returns (TaskReply);
  // 课程/LLM 生成任务。
  rpc GenerateTask(GenerateRequest) returns (TaskReply);
  // 清空区域实体/方块。
  rpc ClearRegion(ClearRequest) returns (Void);
  // 传送玩家。
  rpc Teleport(TeleportRequest) returns (Void);
  // 生成实体。
  rpc SpawnEntity(SpawnRequest) returns (Void);
  // 设置方块（God Mode）。
  rpc SetBlock(SetBlockRequest) returns (Void);
  // 路径可视化：在 A* 航点上刷粒子（demo 寻路展示；写操作，主线程执行）。
  rpc ShowPath(ShowPathRequest) returns (Void);
}
